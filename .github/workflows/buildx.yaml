on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: false
        default: '"ubuntu-latest"'
        description: JSON runner label or label array passed to runs-on
      preinstalled-tools:
        type: boolean
        required: false
        default: false
        description: Use image-owned Hadolint when Dockerfile linting is enabled
      reuse-runner-builder:
        type: boolean
        required: false
        default: false
        description: Reuse BUILDX_BUILDER after verifying it supports every requested platform
      image:
        type: string
        required: true
        description: container image
      registry:
        type: string
        required: false
        default: ''
        description: container registry
      platforms:
        type: string
        required: false
        default: linux/amd64,linux/arm64
        description: platforms to build images for
      context:
        type: string
        required: false
        default: .
        description: Docker build context
      dockerfile:
        type: string
        required: false
        default: Dockerfile
        description: path to Dockerfile
      push:
        type: boolean
        required: false
        default: true
        description: whether to push the built image to the container registry
      cache-type:
        type: string
        required: false
        default: registry
        description: buildx cache type [regstry | gha]
      license:
        type: string
        required: false
        default: BSD-2-Clause-Patent
        description: container image license
      vendor:
        type: string
        required: false
        default: ectobit.com
        description: container image vendor
      hadolint-ignore:
        type: string
        required: false
        default: ''
        description: rules to be ignored by hadolint
      hadolint:
        type: boolean
        required: false
        default: true
        description: whether to lint the Dockerfile with hadolint
      hadolint-failure-threshold:
        type: string
        required: false
        default: info
        description: Hadolint rule severity threshold for pipeline failure
      build-args:
        type: string
        required: false
        default: ''
        description: container image build arguments
      grype:
        type: boolean
        required: false
        default: false
        description: whether to scan the built image with Grype before pushing
      grype-fail-build:
        type: boolean
        required: false
        default: true
        description: whether Grype findings should fail the build
      grype-severity-cutoff:
        type: string
        required: false
        default: high
        description: minimum Grype severity that fails the build when grype-fail-build is true
      grype-vex:
        type: string
        required: false
        default: ''
        description: newline-separated VEX documents passed explicitly to Grype
      grype-sarif-artifact-name:
        type: string
        required: false
        default: grype-sarif
        description: uploaded SARIF artifact name for Grype scan results
    secrets:
      container-registry-username:
        required: true
        description: username for container registry login
      container-registry-password:
        required: true
        description: password for container registry login
    outputs:
      sha-tag:
        description: image short sha tag
        value: ${{ jobs.build.outputs.sha-tag }}

jobs:
  build:
    runs-on: ${{ fromJSON(inputs.runner) }}
    outputs:
      sha-tag: ${{ steps.tags.outputs.sha-tag }}
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
      - name: Lint Dockerfile with ignore
        if: ${{ inputs.hadolint && !inputs.preinstalled-tools && inputs.hadolint-ignore != ''}}
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: ${{ inputs.dockerfile }}
          failure-threshold: ${{ inputs.hadolint-failure-threshold }}
          ignore: ${{ inputs.hadolint-ignore }}
      - name: Lint Dockerfile
        if: ${{ inputs.hadolint && !inputs.preinstalled-tools && inputs.hadolint-ignore == ''}}
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: ${{ inputs.dockerfile }}
          failure-threshold: ${{ inputs.hadolint-failure-threshold }}
      - name: Lint Dockerfile with preinstalled Hadolint
        if: ${{ inputs.hadolint && inputs.preinstalled-tools }}
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
          HADOLINT_FAILURE_THRESHOLD: ${{ inputs.hadolint-failure-threshold }}
          HADOLINT_IGNORE: ${{ inputs.hadolint-ignore }}
        shell: bash
        run: |
          set -euo pipefail
          hadolint --version
          # Hadolint reads HADOLINT_IGNORE and HADOLINT_FAILURE_THRESHOLD from env, as hadolint-action does.
          hadolint "$DOCKERFILE"
      - name: Verify runner builder
        id: runner-builder
        if: ${{ inputs.reuse-runner-builder }}
        env:
          REQUESTED_PLATFORMS: ${{ inputs.platforms }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${BUILDX_BUILDER:-}" || ! "$BUILDX_BUILDER" =~ ^[a-zA-Z0-9][a-zA-Z0-9_.-]*$ ]]; then
            echo "::error::Set BUILDX_BUILDER to this runner's dedicated builder name."
            exit 1
          fi
          docker buildx version
          BUILDER_INFO="$(docker buildx inspect "$BUILDX_BUILDER" --bootstrap)"
          export BUILDER_INFO
          python3 <<'PYTHON'
          import os
          available = set()
          for line in os.environ['BUILDER_INFO'].splitlines():
              if line.strip().startswith('Platforms:'):
                  available.update(p.strip().rstrip('*') for p in line.split(':', 1)[1].split(','))
          requested = {p.strip() for p in os.environ['REQUESTED_PLATFORMS'].split(',') if p.strip()}
          if not requested:
              raise SystemExit('platforms input is empty')
          if requested - available:
              raise SystemExit('Runner builder does not support requested platforms: ' + ', '.join(sorted(requested - available)) + '. Keep QEMU setup enabled until the host supports them.')
          PYTHON
          echo "name=$BUILDX_BUILDER" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        if: ${{ !inputs.reuse-runner-builder }}
        uses: docker/setup-qemu-action@v4.3.0
      - name: Set up Docker Buildx
        if: ${{ !inputs.reuse-runner-builder }}
        uses: docker/setup-buildx-action@v4.3.0
      - name: Set up tags
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ inputs.image }}
          labels: |
            org.opencontainers.image.licenses=${{ inputs.license }}
            org.opencontainers.image.vendor=${{ inputs.vendor }}
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/${{ inputs.image }}/main/README.md
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=edge
            type=sha
      - name: Output short tag
        id: tags
        run: echo "sha-tag=sha-$(echo ${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }} | cut -c1-7)" >> "${GITHUB_OUTPUT}"
      - name: Check Grype scan mode supports the selected platforms
        if: ${{ inputs.grype && contains(inputs.platforms, ',') }}
        run: |
          echo "::error::Grype scan mode builds with load=true and only supports one platform at a time; received '${{ inputs.platforms }}'."
          exit 1
      - name: Login to Docker Hub container registry
        uses: docker/login-action@v4.6.0
        if: ${{ inputs.push && inputs.registry == ''}}
        with:
          username: ${{ secrets.container-registry-username }}
          password: ${{ secrets.container-registry-password }}
      - name: Login to ${{ inputs.registry }} container registry
        uses: docker/login-action@v4.6.0
        if: ${{ inputs.push && inputs.registry != ''}}
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.container-registry-username }}
          password: ${{ secrets.container-registry-password }}
      - name: Build and push image to container registry using registry cache
        uses: docker/build-push-action@v7.4.0
        if: ${{ inputs.grype != true && inputs.cache-type == 'registry' && inputs.build-args == '' }}
        with:
          builder: ${{ steps.runner-builder.outputs.name }}
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ inputs.image }}:buildcache
          cache-to: ${{ inputs.push && format('type=registry,ref={0}:buildcache,mode=max', inputs.image) || 'type=gha,mode=max' }}
      - name: Build and push image with build args ${{ inputs.build-args }} to container registry using registry cache
        uses: docker/build-push-action@v7.4.0
        if: ${{ inputs.grype != true && inputs.cache-type == 'registry' && inputs.build-args != '' }}
        with:
          builder: ${{ steps.runner-builder.outputs.name }}
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          build-args: ${{ inputs.build-args }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ inputs.image }}:buildcache
          cache-to: ${{ inputs.push && format('type=registry,ref={0}:buildcache,mode=max', inputs.image) || 'type=gha,mode=max' }}
      - name: Build and push image to container registry using gha cache
        uses: docker/build-push-action@v7.4.0
        if: ${{ inputs.grype != true && inputs.cache-type == 'gha' && inputs.build-args == '' }}
        with:
          builder: ${{ steps.runner-builder.outputs.name }}
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push image with build args ${{ inputs.build-args }} to container registry using gha cache
        uses: docker/build-push-action@v7.4.0
        if: ${{ inputs.grype != true && inputs.cache-type == 'gha' && inputs.build-args != '' }}
        with:
          builder: ${{ steps.runner-builder.outputs.name }}
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          build-args: ${{ inputs.build-args }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build image locally for Grype scan using registry cache
        uses: docker/build-push-action@v7.4.0
        if: ${{ inputs.grype && inputs.cache-type == 'registry' && inputs.build-args == '' }}
        with:
          builder: ${{ steps.runner-builder.outputs.name }}
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ inputs.image }}:buildcache
          cache-to: ${{ inputs.push && format('type=registry,ref={0}:buildcache,mode=max', inputs.image) || 'type=gha,mode=max' }}
      - name: Build image with build args ${{ inputs.build-args }} locally for Grype scan using registry cache
        uses: docker/build-push-action@v7.4.0
        if: ${{ inputs.grype && inputs.cache-type == 'registry' && inputs.build-args != '' }}
        with:
          builder: ${{ steps.runner-builder.outputs.name }}
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          build-args: ${{ inputs.build-args }}
          platforms: ${{ inputs.platforms }}
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ inputs.image }}:buildcache
          cache-to: ${{ inputs.push && format('type=registry,ref={0}:buildcache,mode=max', inputs.image) || 'type=gha,mode=max' }}
      - name: Build image locally for Grype scan using gha cache
        uses: docker/build-push-action@v7.4.0
        if: ${{ inputs.grype && inputs.cache-type == 'gha' && inputs.build-args == '' }}
        with:
          builder: ${{ steps.runner-builder.outputs.name }}
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build image with build args ${{ inputs.build-args }} locally for Grype scan using gha cache
        uses: docker/build-push-action@v7.4.0
        if: ${{ inputs.grype && inputs.cache-type == 'gha' && inputs.build-args != '' }}
        with:
          builder: ${{ steps.runner-builder.outputs.name }}
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          build-args: ${{ inputs.build-args }}
          platforms: ${{ inputs.platforms }}
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image with Grype
        id: grype
        if: ${{ inputs.grype }}
        uses: anchore/scan-action@v7.4.2
        with:
          image: ${{ inputs.image }}:${{ steps.tags.outputs.sha-tag }}
          fail-build: ${{ inputs.grype-fail-build }}
          severity-cutoff: ${{ inputs.grype-severity-cutoff }}
          vex: ${{ inputs.grype-vex }}
      - name: Upload Grype SARIF artifact
        if: ${{ inputs.grype && always() && steps.grype.outputs.sarif != '' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ inputs.grype-sarif-artifact-name }}
          path: ${{ steps.grype.outputs.sarif }}
      - name: Push scanned image tags
        if: ${{ inputs.grype && inputs.push }}
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then
              docker push "$tag"
            fi
          done <<< "$IMAGE_TAGS"
